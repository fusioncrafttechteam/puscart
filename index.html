<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/src/assets/Puscart logo.jpeg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Security Headers -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-Frame-Options" content="DENY" />
    <meta http-equiv="X-XSS-Protection" content="1; mode=block" />
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
    
    <!-- Content Security Policy -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' 'unsafe-inline' https://checkout.razorpay.com;
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      img-src 'self' data: https:;
      connect-src 'self' https://api.razorpay.com https://tjgklvdmuxnlydwwchso.supabase.co https://*.supabase.co;
      font-src 'self' https://fonts.gstatic.com;
      object-src 'none';
      base-uri 'self';
      form-action 'self';
      frame-ancestors 'none';
      child-src 'self' https://checkout.razorpay.com;
      upgrade-insecure-requests;
    " />
    
    <!-- Permissions Policy -->
    <meta http-equiv="Permissions-Policy" content="
      accelerometer=(),
      camera=(),
      gyroscope=(),
      magnetometer=(),
      microphone=(),
      payment=(),
      usb=(),
      interest-cohort=()
    " />
    
    <title>Puscart Delivery Service</title>
    
    <!-- Preload critical resources -->
    <link rel="preload" href="/src/assets/Puscart logo.jpeg" as="image" type="image/jpeg" />
    
    <!-- Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Theme -->
    <meta name="theme-color" content="#00C4CC" />
    <meta name="description" content="Fast and reliable grocery delivery service" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Test Razorpay API Directly</title>
</head>
<body>
    <h1>Test Razorpay API Directly</h1>
    <button onclick="testRazorpayAPI()">Test Razorpay API</button>
    <button onclick="testEdgeFunction()">Test Edge Function</button>
    <div id="result"></div>

    <script>
        async function testRazorpayAPI() {
            const resultDiv = document.getElementById('result')
            resultDiv.innerHTML = 'Testing Razorpay API directly...'

            try {
                // Test Razorpay API directly
                const response = await fetch('https://api.razorpay.com/v1/orders', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Basic ${btoa('rzp_test_Sfi5w3z9b9KlN2:your_secret_key_here')}`
                    },
                    body: JSON.stringify({
                        amount: 10000, // 100 rupees in paise
                        currency: 'INR',
                        receipt: 'test_' + Date.now(),
                        notes: {
                            test: 'direct_api_test'
                        }
                    })
                })

                const text = await response.text()
                console.log('Razorpay API response:', response.status, text)
                
                resultDiv.innerHTML = `
                    <div style="color: ${response.ok ? 'green' : 'red'};">
                        <h3>Razorpay API Direct - Status: ${response.status}</h3>
                        <pre>${text}</pre>
                    </div>
                `
            } catch (error) {
                console.error('Razorpay API error:', error)
                resultDiv.innerHTML = `<div style="color: red;">Exception: ${error.message}</div>`
            }
        }

        async function testEdgeFunction() {
            const resultDiv = document.getElementById('result')
            resultDiv.innerHTML = 'Testing Edge Function...'

            try {
                // Test Edge Function without auth first
                const response = await fetch('https://tjgklvdmuxnlydwwchso.supabase.co/functions/v1/razorpay-order', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer fake_token_for_test'
                    },
                    body: JSON.stringify({
                        amount: 100,
                        currency: 'INR',
                        receipt: 'test_' + Date.now()
                    })
                })

                const text = await response.text()
                console.log('Edge Function response:', response.status, text)
                
                resultDiv.innerHTML = `
                    <div style="color: ${response.ok ? 'green' : 'red'};">
                        <h3>Edge Function - Status: ${response.status}</h3>
                        <pre>${text}</pre>
                    </div>
                `
            } catch (error) {
                console.error('Edge Function error:', error)
                resultDiv.innerHTML = `<div style="color: red;">Exception: ${error.message}</div>`
            }
        }
    </script>
</body>
</html>

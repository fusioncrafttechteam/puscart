<!DOCTYPE html>
<html>
<head>
    <title>Test Edge Function</title>
</head>
<body>
    <h1>Test Razorpay Edge Function</h1>
    <button onclick="testFunction()">Test Function</button>
    <div id="result"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const supabaseUrl = 'https://tjgklvdmuxnlydwwchso.supabase.co'
        const supabaseAnonKey = 'sb_publishable_faL1nLybWD8uw9uN3K39Cw_VubwRYfz'
        const supabase = createClient(supabaseUrl, supabaseAnonKey)

        async function testFunction() {
            const resultDiv = document.getElementById('result')
            resultDiv.innerHTML = 'Testing...'

            try {
                // Test with proper authentication
                const { data: { session }, error: sessionError } = await supabase.auth.getSession()
                
                if (!session) {
                    resultDiv.innerHTML = '<div style="color: red;">No session found - please login first</div>'
                    return
                }

                console.log('Session found:', session.user.id)
                
                // Call the function
                const { data, error } = await supabase.functions.invoke('razorpay-order', {
                    body: {
                        amount: 100,
                        currency: 'INR',
                        receipt: 'test_' + Date.now()
                    }
                })

                console.log('Function response:', { data, error })
                
                if (error) {
                    resultDiv.innerHTML = `
                        <div style="color: red;">
                            <h3>Function Error</h3>
                            <p><strong>Status:</strong> ${error.context?.status || 'Unknown'}</p>
                            <p><strong>Message:</strong> ${error.message}</p>
                            <p><strong>Details:</strong> ${JSON.stringify(error, null, 2)}</p>
                        </div>
                    `
                } else {
                    resultDiv.innerHTML = `
                        <div style="color: green;">
                            <h3>Success!</h3>
                            <pre>${JSON.stringify(data, null, 2)}</pre>
                        </div>
                    `
                }
                
            } catch (error) {
                console.error('Test error:', error)
                resultDiv.innerHTML = `<div style="color: red;">Exception: ${error.message}</div>`
            }
        }
    </script>
</body>
</html>
